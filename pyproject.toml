[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-file-generator"
version = "1.0.0"
dependencies = [
  "pandas"
]
requires-python = ">=3.10"
authors = [
  {name = "Ali Arabat", email = "arabat50@gmail.com"},
  {name = "Mohammed sayagh", email = "sayaghmohammed@gmail.com"}
]
maintainers = [
  {name = "Ali Arabat", email = "arabat50@gmail.com"}
]
description = "Context file generator!"
readme = "README.rst"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = ["context files", "agents", "AGENTS.md", "CLAUDE.md", "GEMINI.md", ".cursorrules"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.optional-dependencies]
gui = ["PyQt5"]
cli = [
  "rich",
  "click",
]

[project.urls]
Homepage = "https://example.com"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/me/spam.git"
"Bug Tracker" = "https://github.com/me/spam/issues"
Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

